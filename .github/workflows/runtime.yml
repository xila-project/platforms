name: Runtime image

on:
  pull_request:
    paths:
      - Dockerfile.runtime
      - .dockerignore
      - .github/workflows/runtime.yml
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - "**/Cargo.toml"
      - "**/build.rs"
      - build/**
      - core/**
      - tests/**
      - mise.toml
      - "mise.*.toml"
      - tools/mise/**
      - examples/**
      - assets/**
      - drivers/**
      - subsystems/**
      - libraries/**
      - executables/**
      - tools/**
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  primary:
    name: Primary validation for release tag
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  deep:
    name: Deep validation for release tag
    if: startsWith(github.ref, 'refs/tags/v')
    uses: xila-project/core/.github/workflows/extended.yml@3735a377d543c08e402af1e398b5f36bbf481fc9
    with:
      core_ref: 3735a377d543c08e402af1e398b5f36bbf481fc9
    secrets: inherit

  runtime-pr:
    name: Build runtime image for PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_ENV: ci
    steps:
      - name: "Setup | Checkout applications"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Checkout applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 26ee04355c3ddea0f41ee81ece168cec2f9eb376
          path: .application-src
          persist-credentials: false
      - name: "Build | WASI guests"
        run: mise run ci:build-applications
      - name: "Setup | Stage WASI application artifacts"
        run: mkdir -p .application-artifacts && cp .application-src/target/wasm32-wasip1/release-wasm/*.wasm .application-artifacts/
      - name: "Setup | Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Build | Runtime Docker image"
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            applications=./.application-artifacts
          file: Dockerfile.runtime
          platforms: linux/amd64
          load: true
          tags: xila-runtime:ci
          cache-from: type=gha,scope=xila-runtime-linux-amd64
      - name: "Validate | Image user and entrypoint"
        run: |
          test "$(docker inspect --format '{{.Config.User}}' xila-runtime:ci)" = '10001:10001'
          test "$(docker inspect --format '{{json .Config.Entrypoint}}' xila-runtime:ci)" = '["/usr/bin/xila-runtime"]'
      - name: "Build | Runtime smoke-test guest"
        run: mise run ci:runtime-smoke
      - name: "Test | Runtime root, mounts, persistence, and exit status"
        run: |
          set -eu
          fixture="$PWD"
          mkdir -p "$fixture/runtime-input" "$fixture/runtime-output" "$fixture/runtime-state" "$fixture/runtime-fixtures"
          cp runtime-smoke.wasm "$fixture/runtime-fixtures/runtime-smoke.wasm"
          printf 'read-only input' > "$fixture/runtime-input/message.txt"
          chmod 0777 "$fixture/runtime-input" "$fixture/runtime-output" "$fixture/runtime-state"
          run_guest() {
            docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount "type=bind,src=$fixture/runtime-input,dst=/mnt/xila/input,readonly" \
              --mount "type=bind,src=$fixture/runtime-output,dst=/mnt/xila/output" \
              --mount "type=bind,src=$fixture/runtime-state,dst=/var/lib/xila" \
              --mount "type=bind,src=$fixture/runtime-fixtures,dst=/mnt/xila/fixtures,readonly" \
              xila-runtime:ci run --network=none \
              --mount host=/mnt/xila/input,xila=/input,ro \
              --mount host=/mnt/xila/output,xila=/output,rw \
              --mount host=/mnt/xila/fixtures,xila=/fixtures,ro \
              -- /applications/executables/wasm /fixtures/runtime-smoke.wasm "$1"
          }
          run_guest create
          test "$(cat "$fixture/runtime-output/result.txt")" = 'writable output'
          run_guest verify
          if run_guest fail; then echo 'guest failure incorrectly returned success' >&2; exit 1; else status=$?; test "$status" -eq 23; fi
          docker run -d --name xila-runtime-signal-test --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$fixture/runtime-input,dst=/mnt/xila/input,readonly" \
            --mount "type=bind,src=$fixture/runtime-output,dst=/mnt/xila/output" \
            --mount "type=bind,src=$fixture/runtime-state,dst=/var/lib/xila" \
            --mount "type=bind,src=$fixture/runtime-fixtures,dst=/mnt/xila/fixtures,readonly" \
            xila-runtime:ci run --network=none \
            --mount host=/mnt/xila/input,xila=/input,ro \
            --mount host=/mnt/xila/output,xila=/output,rw \
            --mount host=/mnt/xila/fixtures,xila=/fixtures,ro \
            -- /applications/executables/wasm /fixtures/runtime-smoke.wasm wait
          sleep 1
          docker stop --time 5 xila-runtime-signal-test
          signal_status="$(docker inspect --format '{{.State.ExitCode}}' xila-runtime-signal-test)"
          docker rm xila-runtime-signal-test
          test "$signal_status" -eq 143
          run_guest verify
      - name: "Test | Xila CLI via stdin"
        run: |
          set -eu
          mkdir -p "$PWD/runtime-shell-state"
          chmod 0777 "$PWD/runtime-shell-state"
          shell_output="$(printf 'administrator\n\necho shell-smoke-ok\npwd\nexit\n' | \
            docker run --rm -i --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount "type=bind,src=$PWD/runtime-shell-state,dst=/var/lib/xila" \
              xila-runtime:ci shell --network=none)"
          printf '%s\n' "$shell_output" | grep -Fq 'shell-smoke-ok'
          timeout 20s docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$PWD/runtime-shell-state,dst=/var/lib/xila" \
            xila-runtime:ci shell --network=none </dev/null
  runtime:
    name: Build and publish runtime image
    permissions:
      contents: read
      packages: write
    needs: [primary, deep]
    if: >-
      always() && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        (startsWith(github.ref, 'refs/tags/v') &&
         needs.primary.result == 'success' &&
         needs.deep.result == 'success' &&
         needs.deep.outputs.validated-sha == '3735a377d543c08e402af1e398b5f36bbf481fc9')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_ENV: ci
    steps:
      - name: "Setup | Checkout applications"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Checkout pinned Applications"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 26ee04355c3ddea0f41ee81ece168cec2f9eb376
          path: .application-src
          persist-credentials: false
      - name: "Build | Independent WASI guests"
        run: mise run ci:build-applications
      - name: "Setup | Stage WASI application artifacts"
        run: mkdir -p .application-artifacts && cp .application-src/target/wasm32-wasip1/release-wasm/*.wasm .application-artifacts/
      - name: "Setup | Resolve runtime package version"
        id: version
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("examples/native/Cargo.toml").read_text())["package"]["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: "Setup | Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Setup | Container image metadata"
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/xila-runtime
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # PRs only compile the full Dockerfile: no local image load, image export,
      # cache upload, smoke tests, or publication. Main/release runs retain all
      # image-based validation and publication steps.
      - name: "Build | Runtime container image"
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            applications=./.application-artifacts
          file: Dockerfile.runtime
          platforms: linux/amd64
          load: ${{ github.event_name != 'pull_request' }}
          # Explicitly keep PR build results in BuildKit only (no Docker/OCI export).
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          tags: |
            xila-runtime:ci
            ${{ steps.meta.outputs.tags }}
          build-args: |
            XILA_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=xila-runtime-linux-amd64
          # Cache uploads are best-effort: GitHub's cache service can time out
          # after the image was already built successfully.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=xila-runtime-linux-amd64,ignore-error=true' || '' }}
      - name: "Validate | Image user and entrypoint"
        if: github.event_name != 'pull_request'
        run: |
          test "$(docker inspect --format '{{.Config.User}}' xila-runtime:ci)" = '10001:10001'
          test "$(docker inspect --format '{{json .Config.Entrypoint}}' xila-runtime:ci)" = '["/usr/bin/xila-runtime"]'
      - name: "Build | Runtime smoke-test guest"
        if: github.event_name != 'pull_request'
        run: mise run ci:runtime-smoke
      - name: "Test | Runtime root, mounts, persistence, and exit status"
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          fixture="$PWD"
          mkdir -p "$fixture/runtime-input" "$fixture/runtime-output" "$fixture/runtime-state" "$fixture/runtime-fixtures"
          cp runtime-smoke.wasm "$fixture/runtime-fixtures/runtime-smoke.wasm"
          printf 'read-only input' > "$fixture/runtime-input/message.txt"
          chmod 0777 "$fixture/runtime-input" "$fixture/runtime-output" "$fixture/runtime-state"
          run_guest() {
            docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount "type=bind,src=$fixture/runtime-input,dst=/mnt/xila/input,readonly" \
              --mount "type=bind,src=$fixture/runtime-output,dst=/mnt/xila/output" \
              --mount "type=bind,src=$fixture/runtime-state,dst=/var/lib/xila" \
              --mount "type=bind,src=$fixture/runtime-fixtures,dst=/mnt/xila/fixtures,readonly" \
              xila-runtime:ci run --network=none \
              --mount host=/mnt/xila/input,xila=/input,ro \
              --mount host=/mnt/xila/output,xila=/output,rw \
              --mount host=/mnt/xila/fixtures,xila=/fixtures,ro \
              -- /applications/executables/wasm /fixtures/runtime-smoke.wasm "$1"
          }
          run_guest create
          test "$(cat "$fixture/runtime-output/result.txt")" = 'writable output'
          run_guest verify
          if run_guest fail; then echo 'guest failure incorrectly returned success' >&2; exit 1; else status=$?; test "$status" -eq 23; fi
          docker run -d --name xila-runtime-signal-test --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$fixture/runtime-input,dst=/mnt/xila/input,readonly" \
            --mount "type=bind,src=$fixture/runtime-output,dst=/mnt/xila/output" \
            --mount "type=bind,src=$fixture/runtime-state,dst=/var/lib/xila" \
            --mount "type=bind,src=$fixture/runtime-fixtures,dst=/mnt/xila/fixtures,readonly" \
            xila-runtime:ci run --network=none \
            --mount host=/mnt/xila/input,xila=/input,ro \
            --mount host=/mnt/xila/output,xila=/output,rw \
            --mount host=/mnt/xila/fixtures,xila=/fixtures,ro \
            -- /applications/executables/wasm /fixtures/runtime-smoke.wasm wait
          sleep 1
          docker stop --time 5 xila-runtime-signal-test
          signal_status="$(docker inspect --format '{{.State.ExitCode}}' xila-runtime-signal-test)"
          docker rm xila-runtime-signal-test
          test "$signal_status" -eq 143
          run_guest verify
      - name: "Test | Xila CLI via stdin"
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          mkdir -p "$PWD/runtime-shell-state"
          chmod 0777 "$PWD/runtime-shell-state"
          shell_output="$(printf 'administrator\n\necho shell-smoke-ok\npwd\nexit\n' | \
            docker run --rm -i --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount "type=bind,src=$PWD/runtime-shell-state,dst=/var/lib/xila" \
              xila-runtime:ci shell --network=none)"
          printf '%s\n' "$shell_output" | grep -Fq 'shell-smoke-ok'
          timeout 20s docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$PWD/runtime-shell-state,dst=/var/lib/xila" \
            xila-runtime:ci shell --network=none </dev/null
      - name: "Setup | GHCR authentication"
        if: github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish | Runtime image to GHCR"
        if: github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] || docker push "$image"
          done <<< "$IMAGE_TAGS"
