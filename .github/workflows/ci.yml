name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.2
      - run: mise run ci:format-rust
      - run: mise run ci:format-toml
  native:
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 584a600df084e0828d5ce62fd28e1feb215baf09
          path: .application-catalogs
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
      - run: npm ci
      - id: toolchain
        run: mise run ci:toolchain
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          github-cache-mode: target
          cache-generation: v1-platforms-host
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev
      - run: mise run test:seed
      - run: mise run firmware:test
      - run: mise run ci:profiling
      - run: mise run build:native
  browser:
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 584a600df084e0828d5ce62fd28e1feb215baf09
          path: .application-catalogs
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
      - run: npm ci
      - id: toolchain
        run: mise run ci:toolchain
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          github-cache-mode: target
          cache-generation: v1-platforms-browser
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: mise run check:browser
      - run: node --test examples/wasm/tests/disk_manager.test.mjs
  required:
    if: always()
    needs: [quality, native, browser]
    runs-on: ubuntu-latest
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success && test "$BROWSER" = success
