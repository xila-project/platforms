name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
jobs:
  diagnose-package-lock:
    name: "Diagnostic / Resolve Cargo package graph"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Diagnostic | Resolve Cargo package manager dependencies"
        run: |
          cargo metadata --format-version 1 > /tmp/xila-metadata.json
          git diff -- Cargo.lock
  quality:
    name: "Quality / Rust"
    uses: xila-project/workspace/.github/workflows/quality.yml@d4ff44239bcfa0bc662e37f38d00f3d23f8f04db
  native:
    name: "Build & Test / Native platform"
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Checkout application catalogs"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 26ee04355c3ddea0f41ee81ece168cec2f9eb376
          path: .application-catalogs
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@d4ff44239bcfa0bc662e37f38d00f3d23f8f04db
        with:
          cache-mode: target
          cache-generation: v1-platforms-host
      - name: "Setup | Locked npm dependencies"
        run: mise run ci:deps-npm
      - name: "Setup | Native build dependencies"
        run: mise run ci:packages-host
      - name: "Lint | Platform drivers"
        run: mise run clippy:drivers
      - name: "Test | Platform drivers"
        run: mise run test:drivers
      - name: "Test | Filesystem seed"
        run: mise run test:seed
      - name: "Test | Native firmware"
        run: mise run firmware:test
      - name: "Test | Profiling"
        run: mise run ci:profiling
      - name: "Test | Runtime profiling"
        run: mise run ci:profiling-runtime-tests
      - name: "Test | Native profiling"
        run: mise run ci:profiling-native-tests
      - name: "Build | Native platform"
        run: mise run build:native
  browser:
    name: "Build & Test / Browser platform"
    runs-on: ubuntu-latest
    env:
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Checkout application catalogs"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 26ee04355c3ddea0f41ee81ece168cec2f9eb376
          path: .application-catalogs
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@d4ff44239bcfa0bc662e37f38d00f3d23f8f04db
        with:
          cache-mode: target
          cache-generation: v1-platforms-browser
      - name: "Setup | Locked npm dependencies"
        run: mise run ci:deps-npm
      - name: "Setup | Clang and linker dependencies"
        run: mise run ci:packages-linker
      - name: "Lint | Browser drivers"
        run: mise run clippy:browser
      - name: "Build | Browser platform check"
        run: mise run check:browser
      - name: "Test | Browser integration"
        run: mise run ci:browser-node-tests
  required:
    if: always()
    needs: [quality, native, browser]
    runs-on: ubuntu-latest
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success && test "$BROWSER" = success
