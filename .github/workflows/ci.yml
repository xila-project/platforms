name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
jobs:
  quality:
    name: "Quality / Rust"
    uses: xila-project/workspace/.github/workflows/quality.yml@ab0393f7a1df988b8fcd13da38e013057e9c9de8
    with:
      extra-task: ci:quality-extra
  native:
    name: "Build & Test / Native platform"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep source locations in test backtraces while shrinking build artifacts.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-platforms-host-line-tables
      - name: "Setup | Resolve locked Xila revisions"
        id: locked
        run: mise run ci:locked-revisions
      - name: "Setup | Checkout application catalogs"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: ${{ steps.locked.outputs.applications }}
          path: .application-catalogs
          persist-credentials: false
      - name: "Setup | Locked npm dependencies"
        run: mise run ci:deps-npm
      - name: "Setup | Native build dependencies"
        run: mise run ci:packages-host
      - name: "Lint | Platform drivers"
        run: mise run clippy:drivers
      - name: "Test | Platform drivers"
        run: mise run test:drivers
      - name: "Test | Filesystem seed"
        run: mise run test:seed
      - name: "Test | Native firmware"
        run: mise run firmware:test
      - name: "Test | Profiling"
        run: mise run ci:profiling
      - name: "Test | Runtime profiling"
        run: mise run ci:profiling-runtime-tests
      - name: "Test | Native profiling"
        run: mise run ci:profiling-native-tests
      - name: "Test | Heaptrack allocation probe"
        run: mise run ci:profiling-heap-smoke
      - name: "Build | Native platform"
        run: mise run build:native
      - name: "Build | Native release executable"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise run release:native
      - name: "Report | Upload native release input"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: xila-native-linux-x86_64
          path: target/release/native_example
          if-no-files-found: error
  nano-33-ble:
    name: "Build / Arduino Nano 33 BLE"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-platforms-nano-33-ble
      - name: "Setup | Clang and linker dependencies"
        run: mise run ci:packages-linker
      - name: "Build | Arduino Nano 33 BLE firmware"
        run: mise run build:nano-33-ble
      - name: "Build | Export Nano 33 BLE image"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise run release:nano-33-ble-image
      - name: "Report | Upload Nano 33 BLE release input"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: xila-nano-33-ble
          path: target/release-artifacts/nano-33-ble.bin
          if-no-files-found: error
  browser:
    name: "Build & Test / Browser platform"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XILA_MBX: "1"
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-catalogs
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@ab0393f7a1df988b8fcd13da38e013057e9c9de8
        with:
          cache-mode: target
          cache-generation: v1-platforms-browser
      - name: "Setup | Resolve locked Xila revisions"
        id: locked
        run: mise run ci:locked-revisions
      - name: "Setup | Checkout application catalogs"
        uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: ${{ steps.locked.outputs.applications }}
          path: .application-catalogs
          persist-credentials: false
      - name: "Setup | Locked npm dependencies"
        run: mise run ci:deps-npm
      - name: "Setup | Clang and linker dependencies"
        run: mise run ci:packages-linker
      - name: "Lint | Browser drivers"
        run: mise run clippy:browser
      - name: "Build | Browser platform check"
        run: mise run check:browser
      - name: "Test | Browser integration"
        run: mise run ci:browser-node-tests
      - name: "Test | Browser HTTP client device"
        run: mise run test:browser-http
      - name: "Test | Browser drivers in Chrome"
        run: mise run test:browser-drivers
  espressif-emulator:
    # Advisory while the emulator check settles: not in the `required` gate.
    name: "Test / ${{ matrix.name }} emulator"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32s3
            name: ESP32-S3
            task: test:esp32-s3-qemu
            sdk-packages: ci:packages-espressif-sdk
          - chip: esp32c6
            name: ESP32-C6
            task: test:esp32-c6-qemu
            sdk-packages: ci:packages-espressif-sdk-riscv
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Native QEMU libraries"
        run: mise run ci:packages-espressif
      - name: "Setup | Native SDK packages"
        run: mise run ${{ matrix.sdk-packages }}
      - name: "Setup | Espressif Rust and GCC toolchain"
        if: matrix.chip == 'esp32s3'
        run: mise run setup:espressif-rust
      - name: "Setup | Locked npm dependencies"
        if: matrix.chip == 'esp32s3'
        run: mise run ci:deps-npm
      - name: "Test | Boot in QEMU"
        run: mise run ${{ matrix.task }}
      - name: "Report | Upload emulator logs and screenshot"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.chip }}-emulator
          path: |
            target/espressif-emulator/runs/${{ matrix.chip }}.*/uart.log
            target/espressif-emulator/runs/${{ matrix.chip }}.*/qemu.log
            target/espressif-emulator/runs/${{ matrix.chip }}.*/screen.png
  espressif-boards:
    # Advisory builds of the hardware boards; their boot is checked on the
    # boards themselves.
    name: "Build / ${{ matrix.name }} firmware"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32-p4-function-ev-board
            name: ESP32-P4-Function-EV-Board
            xtensa: false
            graphics: false
            task: build:esp32-p4-function-ev-board
          - board: wt32-sc01
            name: WT32-SC01
            xtensa: true
            graphics: true
            task: build:wt32-sc01
          - board: wt32-sc01-plus
            name: WT32-SC01 Plus
            xtensa: true
            graphics: true
            task: build:wt32-sc01-plus
          - board: wt32-sc01-plus
            name: WT32-SC01 Plus (USB human interface)
            xtensa: true
            graphics: true
            task: check:wt32-sc01-plus-usb-human-interface
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Activate mise"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Native build and flasher dependencies"
        run: mise run ci:packages-espressif
      - name: "Setup | Espressif Rust and GCC toolchain"
        if: matrix.xtensa
        run: mise run setup:espressif-rust
      - name: "Setup | Locked npm dependencies"
        # Xila's graphics converts its fonts with the locked `lv_font_conv`.
        if: matrix.graphics
        run: mise run ci:deps-npm
      - name: "Build | ${{ startsWith(matrix.task, 'check:') && 'Firmware ELF only (check)' || 'Flash image' }}"
        run: mise run ${{ matrix.task }}
  required:
    if: always()
    needs: [quality, native, nano-33-ble, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          NANO_33_BLE: ${{ needs.nano-33-ble.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success && test "$NANO_33_BLE" = success && test "$BROWSER" = success
