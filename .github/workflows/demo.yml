name: Browser demonstrations
on:
  pull_request:
  workflow_call:
    inputs:
      platform_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      platform_ref:
        description: Platforms commit SHA (defaults to the selected branch)
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
      XILA_DEMO_LOCALES: ${{ github.event_name == 'pull_request' && 'en' || 'en fr es de pt-BR it pl' }}
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - uses: actions/checkout@v7
        with:
          repository: xila-project/platforms
          ref: ${{ inputs.platform_ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 44cafb2d93760705dc087972ef87cf827dcfa8d1
          path: .application-src
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
      - run: npm ci
      - id: toolchain
        run: mise run ci:toolchain
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          github-cache-mode: objects
          cache-generation: v1-platforms-pages-all-locales
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev
      - name: Build localized demonstrations and verify filesystem images
        env:
          CARGO_TARGET_ROOT: ${{ github.workspace }}/target/pages
        run: mise run pages:build
      - uses: actions/upload-artifact@v7
        with:
          name: platform-demonstrations
          path: pages/demonstrations/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: reference-filesystem-images
          path: target/reference-filesystem-images/
          if-no-files-found: error
