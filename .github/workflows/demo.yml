name: Browser demonstrations
on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      platform_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      platform_ref:
        description: Platforms commit SHA (defaults to the selected branch)
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENV: ci
      CARGO_TERM_COLOR: always
      XILA_MBX: "1"
      XILA_DEMO_LOCALES: ${{ github.event_name == 'pull_request' && 'en' || 'en fr es de pt-BR it pl' }}
      XILA_FONT_CATALOG_ROOTS: ${{ github.workspace }}/.application-src
    steps:
      - uses: actions/checkout@v7
        with:
          repository: xila-project/platforms
          ref: ${{ inputs.platform_ref || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: xila-project/applications
          ref: 26ee04355c3ddea0f41ee81ece168cec2f9eb376
          path: .application-src
          persist-credentials: false
      - uses: xila-project/workspace/.github/actions/setup-rust@d4ff44239bcfa0bc662e37f38d00f3d23f8f04db
        with:
          cache-mode: objects
          cache-generation: v1-platforms-pages-all-locales
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run ci:deps-npm
      - run: mise run ci:packages-host
      - name: Build localized demonstrations and verify filesystem images
        env:
          CARGO_TARGET_ROOT: ${{ github.workspace }}/target/pages
        run: mise run pages:build
      - name: Add Pages landing page
        run: cp examples/wasm/pages-index.html pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages/
      - uses: actions/upload-artifact@v7
        with:
          name: platform-demonstrations
          path: pages/demonstrations/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: reference-filesystem-images
          path: target/reference-filesystem-images/
          if-no-files-found: error
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (inputs.platform_ref == '' || inputs.platform_ref == github.sha))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
