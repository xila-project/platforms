<!doctype html>
<html>
  <head>
    <link data-trunk rel="rust" data-keep-debug />
    <link data-trunk rel="icon" href="images/favicon.svg" />
    <link data-trunk rel="copy-dir" href="images/" />
    <link data-trunk rel="copy-dir" href="fonts/" />
    <link data-trunk rel="copy-file" href="disk_manager.mjs" />
    <link data-trunk rel="copy-file" href="disk_names.mjs" />
    <link data-trunk rel="copy-file" href="disk_preferences.mjs" />
    <link data-trunk rel="copy-file" href="../../target/seed/wasm/seed.img" />
    <link data-trunk rel="css" href="styles.css" />

    <link rel="stylesheet" href="fonts/montserrat.css" />
    <title>Xila WASM Example</title>
  </head>
  <body>
    <div id="sidebar">
      <h2>Xila Help</h2>
      <label class="disk-persistence-setting">
        <input
          id="disk-persistence"
          type="checkbox"
          role="switch"
          aria-controls="saved-disk-controls"
          disabled
        />
        Keep my files between visits
      </label>
      <p id="memory-disk-notice">Changes are discarded on reload.</p>
      <div id="saved-disk-controls" hidden>
        <label for="disk-list">Available disks</label>
        <select id="disk-list" size="5" aria-label="Available Xila disks"></select>
        <div class="disk-actions">
          <button id="disk-select" type="button" disabled>
            Use selected disk
          </button>
          <button id="disk-create" type="button" disabled>New disk</button>
          <button id="disk-remove" type="button" disabled>Remove</button>
          <button id="disk-rebuild" type="button" hidden disabled>
            Rebuild from the current version
          </button>
        </div>
      </div>
      <p id="disk-status" role="status" aria-live="polite">
        Starting Xila…
      </p>
      <button id="audio-enable" type="button" aria-live="polite">
        Enable audio before launching Synth
      </button>
      <hr />
      <h3>Default credentials</h3>
      <ul>
        <li><strong>Username:</strong> administrator</li>
        <li><strong>Password:</strong> (no password)</li>
      </ul>
      See <a href="https://www.xila.dev">xila.dev</a> for more information.
      <p>
        Some features are limited by browser security, including the network
        stack.
      </p>

      <button
        id="sidebar-toggle"
        onclick="toggleSidebar()"
        aria-label="Toggle Help Panel"
      >
        <img
          id="sidebar-arrow"
          src="images/chevron-right-solid-full.svg"
          alt="Toggle Sidebar"
          style="width: 20px; height: 20px; transition: transform 0.2s"
        />
      </button>
    </div>
    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const arrow = document.getElementById("sidebar-arrow");
        sidebar.classList.toggle("open");
        if (sidebar.classList.contains("open")) {
          arrow.src = "images/chevron-left-solid-full.svg";
        } else {
          arrow.src = "images/chevron-right-solid-full.svg";
        }
      }
    </script>
    <script type="module" src="disk_manager.mjs"></script>
  </body>
</html>
