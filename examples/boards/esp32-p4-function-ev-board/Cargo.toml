[package]
name = "xila-board-esp32-p4-function-ev-board"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Espressif's ESP32-P4X-Function-EV-Board (chip revision v3.0 or later, 16 MB flash)."

# The board selects the chip: exactly one chip feature of each Espressif crate.
[target.'cfg(all(target_os = "none", target_arch = "riscv32"))'.dependencies]
drivers_espressif = { package = "xila-drivers-espressif", path = "../../../drivers/espressif", default-features = false, features = [
  "esp32p4",
] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32p4"] }
esp-hal = { version = "=1.2.2", features = ["esp32p4", "unstable"] }
esp-println = { version = "0.18", default-features = false, features = [
  "esp32p4",
  "uart",
] }
esp-storage = { version = "0.10", features = ["esp32p4"] }
# No Settings on this board: the `time_zone` shell command sets the time zone.
firmware = { package = "xila-firmware-espressif", path = "../../../firmware/espressif", features = [
  "time-zone-command",
] }
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false }

[features]
# Developer-only handler that runs raw ELF files from the file system as native
# executables. It does not sandbox them.
native-dev = ["firmware/native-dev"]
# Statically linked C demo executable mounted at `/applications/executables/c_demo`.
native-linked = ["firmware/native-linked"]

[[bin]]
name = "esp32_p4_function_ev_board"
path = "src/main.rs"
