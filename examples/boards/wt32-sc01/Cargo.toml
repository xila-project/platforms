[package]
name = "xila-board-wt32-sc01"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Wireless-Tag's WT32-SC01 (ESP32, 4 MB flash, 8 MB PSRAM)."

# The board selects the chip: exactly one chip feature of each Espressif crate.
[target.'cfg(all(target_os = "none", target_arch = "xtensa"))'.dependencies]
drivers_espressif = { package = "xila-drivers-espressif", path = "../../../drivers/espressif", default-features = false, features = [
  "esp32",
  "gpio",
  "spi-display",
] }
critical-section = { workspace = true }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32"] }
esp-hal = { version = "=1.2.2", features = ["esp32", "unstable"] }
esp-storage = { version = "0.10", features = ["esp32"] }
firmware = { package = "xila-firmware-espressif", path = "../../../firmware/espressif", features = [
  "graphics",
] }
esp-println = { version = "0.18", default-features = false, features = [
  "esp32",
  "uart",
] }
mipidsi = { git = "https://github.com/almindor/mipidsi", rev = "5ed6df58d9b8a2b9037221bc03de1328340eaf47", default-features = false }
static_cell = "2"
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false }

[features]
# Time zone features of Settings and the shell, passed to the firmware. The
# default is the UTC offset form only: no zone names and no `time_zone` shell
# command, to keep the 2.25 MiB application partition for code. See
# examples/boards/README.md for the flash cost of each.
default = ["time-zone-offset-form"]
time-zone-command = ["firmware/time-zone-command"]
time-zone-offset-form = ["firmware/time-zone-offset-form"]
time-zone-names-africa = ["firmware/time-zone-names-africa"]
time-zone-names-america = ["firmware/time-zone-names-america"]
time-zone-names-antarctica = ["firmware/time-zone-names-antarctica"]
time-zone-names-arctic = ["firmware/time-zone-names-arctic"]
time-zone-names-asia = ["firmware/time-zone-names-asia"]
time-zone-names-atlantic = ["firmware/time-zone-names-atlantic"]
time-zone-names-australia = ["firmware/time-zone-names-australia"]
time-zone-names-etc = ["firmware/time-zone-names-etc"]
time-zone-names-europe = ["firmware/time-zone-names-europe"]
time-zone-names-indian = ["firmware/time-zone-names-indian"]
time-zone-names-pacific = ["firmware/time-zone-names-pacific"]
time-zone-names-all = ["firmware/time-zone-names-all"]
time-zone-names-legacy-aliases = ["firmware/time-zone-names-legacy-aliases"]
# Enables debug-level serial logging, including periodic display flush,
# frame-rate and invalidation summaries.
debug-log = ["firmware/debug-log"]
# Reports at boot what the hardware compare-and-set instruction does on a
# word in PSRAM. The firmware never uses the instruction there; this is for
# checking the chip.
hardware-atomics-probe = []

[[bin]]
name = "wt32_sc01"
path = "src/main.rs"
