[package]
name = "xila-board-wt32-sc01-plus"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Wireless-Tag's WT32-SC01 Plus (ESP32-S3, 16 MB flash, 2 MB PSRAM)."

# The board selects the chip: exactly one chip feature of each Espressif crate.
[target.'cfg(all(target_os = "none", target_arch = "xtensa"))'.dependencies]
drivers_espressif = { package = "xila-drivers-espressif", path = "../../../drivers/espressif", default-features = false, features = [
  "esp32s3",
] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-storage = { version = "0.10", features = ["esp32s3"] }
firmware = { package = "xila-firmware-espressif", path = "../../../firmware/espressif" }
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false }

[[bin]]
name = "wt32_sc01_plus"
path = "src/main.rs"
