[package]
name = "xila-board-wt32-sc01-plus"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Wireless-Tag's WT32-SC01 Plus (ESP32-S3, 16 MB flash, 2 MB PSRAM, 3.5-inch touch screen)."

# The board selects the chip: exactly one chip feature of each Espressif crate.
[target.'cfg(all(target_os = "none", target_arch = "xtensa"))'.dependencies]
critical-section = { workspace = true }
drivers_espressif = { package = "xila-drivers-espressif", path = "../../../drivers/espressif", default-features = false, features = [
  "esp32s3",
  "gpio",
  "lcd-i8080",
  "sd-card",
] }
drivers_shared = { package = "xila-drivers-shared", path = "../../../drivers/shared", default-features = false, features = [
  "display-mipidsi",
] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-storage = { version = "0.10", features = ["esp32s3"] }
firmware = { package = "xila-firmware-espressif", path = "../../../firmware/espressif", features = [
  "graphics",
  "neural-network",
  "wasm",
  "wifi",
] }
# `Display::set_pixels_raw` (almindor/mipidsi#205) is not released yet: switch
# to the next crates.io release once it is out.
mipidsi = { git = "https://github.com/almindor/mipidsi", rev = "5ed6df58d9b8a2b9037221bc03de1328340eaf47", default-features = false }
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false, features = [
  "graphics_rendering_rgb565",
] }

[features]
# Time zone features of Settings and the shell, passed to the firmware. The
# default is all zone names: the board ships the whole IANA table and the raw
# TZ string editor, so the UTC offset form stays opt-in through its own
# feature. The `time_zone` shell command is off because Settings covers it.
# See examples/boards/README.md for the flash cost of each.
default = ["time-zone-names-all"]
time-zone-command = ["firmware/time-zone-command"]
time-zone-offset-form = ["firmware/time-zone-offset-form"]
time-zone-names-africa = ["firmware/time-zone-names-africa"]
time-zone-names-america = ["firmware/time-zone-names-america"]
time-zone-names-antarctica = ["firmware/time-zone-names-antarctica"]
time-zone-names-arctic = ["firmware/time-zone-names-arctic"]
time-zone-names-asia = ["firmware/time-zone-names-asia"]
time-zone-names-atlantic = ["firmware/time-zone-names-atlantic"]
time-zone-names-australia = ["firmware/time-zone-names-australia"]
time-zone-names-etc = ["firmware/time-zone-names-etc"]
time-zone-names-europe = ["firmware/time-zone-names-europe"]
time-zone-names-indian = ["firmware/time-zone-names-indian"]
time-zone-names-pacific = ["firmware/time-zone-names-pacific"]
time-zone-names-all = ["firmware/time-zone-names-all"]
time-zone-names-legacy-aliases = ["firmware/time-zone-names-legacy-aliases"]
# Logs CPU, flash and PSRAM timings once at boot, right after the PSRAM
# self-test. Off by default so production boots stay fast and quiet.
boot-benchmark = []
# Enables debug-level serial logging, including periodic display flush,
# frame-rate and invalidation summaries.
debug-log = ["firmware/debug-log"]
# Runs the console and the human interface emulation (USB keyboard, media
# remote, mouse and system control toward the connected computer) over one
# composite USB device on the USB OTG controller, instead of the USB
# Serial/JTAG controller. See the README: flashing then needs the BOOT button
# held at reset, and the device uses the pid.codes test identifiers 1209:0001.
usb-human-interface = [
  "drivers_espressif/usb-human-interface",
  "firmware/usb-human-interface",
]

[[bin]]
name = "wt32_sc01_plus"
path = "src/main.rs"
