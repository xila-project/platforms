[package]
name = "xila-native-example"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
xila = { workspace = true, features = [
  "graphics",
  "graphics_rendering_xrgb8888",
  "bootsplash",
] }
c_demo = { workspace = true }
file_manager = { workspace = true }
command_line_shell = { workspace = true }
graphical_shell = { workspace = true }
wasm = { workspace = true, features = ["host", "graphics"] }
terminal = { workspace = true }
settings = { workspace = true }
debug_application = { workspace = true }
activity = { workspace = true }
package = { workspace = true }
drivers_core = { workspace = true }
drivers_peripherals = { workspace = true }
drivers_std = { workspace = true }
drivers_shared = { workspace = true }
drivers_native = { workspace = true }
drivers_headless = { workspace = true }
startup_application = { package = "xila-startup-application", path = "../../firmware/startup_application" }
audio = { workspace = true, optional = true }
getargs = { version = "0.5" }
getargs-derive = { workspace = true }

[features]
neural-network = ["drivers_shared/neural-network"]
# Host audio and the portable NN demo are available in the default runtime.
default = ["audio", "neural-network", "human-interface"]
audio = ["dep:audio", "drivers_native/audio"]
# Linux uinput human interface emulation at /devices/human_interface/emulation (no-op on
# other hosts). Without write access to /dev/uinput the device is not mounted.
human-interface = [
  "drivers_std/human-interface",
  "drivers_peripherals/human-interface",
]
# Compatibility flag: bundled applications now always come from the seed.
prebuilt-applications = []
profiling = ["drivers_std/profiling", "prebuilt-applications"]
heaptrack = ["drivers_std/heaptrack", "prebuilt-applications"]
# Developer-only handler that runs raw ELF files from the file system as native
# executables (Linux on x86-64 or AArch64). It does not sandbox them.
native-dev = ["xila/native-dev"]

[[bin]]
name = "native_example"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0"
