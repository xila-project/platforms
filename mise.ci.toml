[wrappers.cargo]
command = "env"
args = [
  "{% if env.XILA_MBX | default(value='0') == '1' %}mbx{% else %}cargo{% endif %}",
]
env = { MBX_CARGO_SHIM_MODE = "1" }

[task_templates."ci:rust".tools]
rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }

[task_templates."ci:browser".tools]
rust = { version = "{{ vars.rust_version }}", profile = "minimal", targets = [
  "wasm32-unknown-unknown",
] }

[tasks."ci:format-rust"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
] }
run = "cargo fmt --all -- --check"

[tasks."ci:format-toml"]
tools.taplo = "{{ vars.taplo_version }}"
run = "taplo format --check"

[tasks."build:native"]
extends = "ci:rust"

[tasks."test:seed"]
extends = "ci:rust"

[tasks."check:browser"]
extends = "ci:browser"

[tasks."ci:toolchain"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal" }
run = '''
set -eu
rustc --version
if [ -n "${GITHUB_OUTPUT:-}" ]; then
  echo "version={{ vars.rust_version }}" >> "$GITHUB_OUTPUT"
fi
'''

[tasks."ci:build-applications"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-wasip1",
] }
run = "cargo build --locked --manifest-path .application-src/Cargo.toml --target wasm32-wasip1 --profile release-wasm -p xila-calculator -p xila-clock -p xila-weather -p xila-pixel-painter -p xila-text-editor -p xila-synth"

[tasks."ci:runtime-smoke"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", targets = [
  "wasm32-wasip1",
] }
run = "rustc --edition=2021 --target wasm32-wasip1 -O tests/container/runtime_smoke.rs -o runtime-smoke.wasm"

[tasks."firmware:test"]
extends = "ci:rust"

[tasks."pages:demo"]
dir = "examples/wasm"
tools.rust = { version = "nightly-2026-10-12", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
tools."github:trunk-rs/trunk" = "0.21.14"
run = "trunk build --release --public-url ./"

[tasks."pages:build"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-wasip1",
  "wasm32-unknown-unknown",
] }
run = '''
set -eu
mkdir -p pages/demonstrations/wasm target/reference-filesystem-images
for locale in ${XILA_DEMO_LOCALES:-en fr es de pt-BR it pl}; do
  export EMBEDDED_I18N_LOCALE="$locale"
  export CARGO_TARGET_DIR="${CARGO_TARGET_ROOT:-$PWD/target/pages}/$locale"
  mise run ci:build-applications
  mkdir -p "$CARGO_TARGET_DIR/seed/wasm" target/seed/wasm
  cargo run --locked -p xila-fs-image -- "$CARGO_TARGET_DIR/seed/wasm/seed.img" 16777216 --bundle wasm --applications-dir "$CARGO_TARGET_DIR/wasm32-wasip1/release-wasm"
  cargo run --locked -p xila-fs-image -- "$CARGO_TARGET_DIR/seed/wasm/repeated.img" 16777216 --bundle wasm --applications-dir "$CARGO_TARGET_DIR/wasm32-wasip1/release-wasm"
  cmp "$CARGO_TARGET_DIR/seed/wasm/seed.img" "$CARGO_TARGET_DIR/seed/wasm/repeated.img"
  rm "$CARGO_TARGET_DIR/seed/wasm/repeated.img"
  cargo run --locked -p xila-fs-image -- "$CARGO_TARGET_DIR/seed/wasm/native.img" 16777216 --bundle native --applications-dir "$CARGO_TARGET_DIR/wasm32-wasip1/release-wasm"
  cargo run --locked -p xila-fs-image -- "$CARGO_TARGET_DIR/seed/wasm/native-repeated.img" 16777216 --bundle native --applications-dir "$CARGO_TARGET_DIR/wasm32-wasip1/release-wasm"
  cmp "$CARGO_TARGET_DIR/seed/wasm/native.img" "$CARGO_TARGET_DIR/seed/wasm/native-repeated.img"
  rm "$CARGO_TARGET_DIR/seed/wasm/native-repeated.img"
  mkdir -p "target/reference-filesystem-images/$locale"
  cp "$CARGO_TARGET_DIR/seed/wasm/seed.img" "target/reference-filesystem-images/$locale/wasm.img"
  cp "$CARGO_TARGET_DIR/seed/wasm/native.img" "target/reference-filesystem-images/$locale/native.img"
  cp "$CARGO_TARGET_DIR/seed/wasm/seed.img" target/seed/wasm/seed.img
  mise run pages:demo
  mkdir -p "pages/demonstrations/wasm/$locale"
  cp -r examples/wasm/dist/. "pages/demonstrations/wasm/$locale/"
done
'''

[tasks."ci:profiling"]
extends = "ci:rust"
run = "cargo test --locked --manifest-path tools/profiling/Cargo.toml"

[tasks."test:drivers"]
extends = "ci:rust"

[tasks."clippy:drivers"]
extends = "ci:rust"

[tasks."clippy:browser"]
extends = "ci:browser"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "clippy",
], targets = [
  "wasm32-unknown-unknown",
] }

[tasks."build:profiling"]
extends = "ci:rust"

[tasks."ci:profiling-runtime-tests"]
extends = "ci:rust"
run = "cargo test --locked -p xila-drivers-std --lib --features profiling,heaptrack"

[tasks."ci:profiling-native-tests"]
extends = "ci:rust"
run = "cargo test --locked -p xila-native-example --bin native_example --features profiling,heaptrack"

[tasks."ci:lint-workflows"]
tools."aqua:rhysd/actionlint" = "{{ vars.actionlint_version }}"
tools."aqua:koalaman/shellcheck" = "{{ vars.shellcheck_version }}"
run = "actionlint"

# Native dependencies are applied only by explicit mise bootstrap tasks.
[bootstrap.packages]
"apt:clang" = { env = "ci" }
"apt:libclang-dev" = { env = "ci" }
"apt:pkg-config" = { env = "host" }
"apt:libasound2-dev" = { env = "host" }
"apt:libudev-dev" = { env = "host" }
"apt:libxkbcommon-dev" = { env = "host" }
"apt:libwayland-dev" = { env = "host" }
"apt:libx11-dev" = { env = "host" }
"apt:libxkbcommon-x11-dev" = { env = "host" }

[tasks."ci:packages-linker"]
description = "Install required CI linker packages through mise bootstrap"
run = "mise -E ci bootstrap packages apply --manager apt --update --yes"

[tasks."ci:packages-host"]
description = "Install required native GUI and linker packages through mise bootstrap"
run = "mise -E ci,host bootstrap packages apply --manager apt --update --yes"

[tasks."ci:deps-npm"]
description = "Install locked Node tooling using the pinned mise version"
tools.node = "{{ vars.node_version }}"
run = "npm ci"

[tasks."ci:browser-node-tests"]
description = "Run Web runtime and disk manager JavaScript tests with pinned Node"
tools.node = "{{ vars.node_version }}"
run = "node --test drivers/wasm/tests/seed.test.mjs && node --test examples/wasm/tests/disk_manager.test.mjs"

[tasks."ci:quality-extra"]
description = "Validate platform-specific CI workflow and source policies"
run = "python3 -m unittest discover -s tools/ci -v"

[tasks."ci:deps-npm-applications"]
description = "Install locked dependencies in the explicitly checked-out Applications repository"
tools.node = "{{ vars.node_version }}"
run = "npm ci --prefix ../applications"

[tasks."ci:integration-toolchain"]
description = "Install pinned WASI and native integration Rust targets via mise"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "rustfmt",
], targets = [
  "wasm32-wasip1",
] }
run = "rustc --version"
