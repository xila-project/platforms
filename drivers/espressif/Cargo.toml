[package]
name = "xila-drivers-espressif"
version.workspace = true
edition = "2024"
rust-version.workspace = true

# Everything is target-gated: on host targets this crate is empty and builds
# nothing, so the Platforms workspace stays checkable on x86_64.
[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
critical-section = { workspace = true }
drivers_peripherals = { workspace = true, optional = true }
drivers_shared = { package = "xila-drivers-shared", path = "../shared", default-features = false, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-net-driver = { version = "0.2", optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-time-driver = { workspace = true, features = [
  "tick-hz-1_000_000",
], optional = true }
embassy-time-queue-utils = { workspace = true, features = [
  "integrated-timers",
], optional = true }
file_system = { workspace = true, optional = true }
log = { workspace = true, optional = true }
shared = { workspace = true, optional = true }
static_cell = { version = "2", optional = true }
embedded-hal = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
esp-hal = { version = "=1.2.2", default-features = false, features = [
  "unstable",
], optional = true }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "esp32s3",
  "unstable",
  "wifi",
], optional = true }
esp-radio-rtos-driver = { version = "=0.4.2", optional = true }
esp-rtos = { version = "=0.4.0", features = [
  "esp-radio",
  "esp32s3",
], optional = true }
memory = { workspace = true }
network = { workspace = true, optional = true }
smoltcp = { version = "0.14", default-features = false, optional = true }
time = { workspace = true, optional = true }
native_loader = { workspace = true, optional = true }
peripherals = { workspace = true, optional = true }
task = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }

[dev-dependencies]
file_system = { workspace = true }
network = { workspace = true }

[features]
default = ["gpio", "i2c", "spi", "uart"]

# Peripheral adapters.
gpio = [
  "dep:drivers_peripherals",
  "dep:embedded-hal",
  "dep:peripherals",
  "dep:task",
  "dep:virtual_file_system",
  "drivers_peripherals/gpio",
  "peripherals/gpio",
]
i2c = ["dep:embedded-hal", "dep:peripherals", "peripherals/i2c"]
spi = ["dep:embedded-hal", "dep:peripherals", "peripherals/spi"]
uart = ["dep:embedded-io", "dep:peripherals", "peripherals/uart"]

# Shell runtime drivers.
console = [
  "dep:drivers_shared",
  "dep:embassy-futures",
  "dep:embedded-io-async",
  "dep:embassy-sync",
  "dep:file_system",
  "dep:log",
  "dep:shared",
]
# 8080 parallel display bus over LCD_CAM with DMA (ESP32-S3), for `mipidsi`.
lcd-i8080 = ["dep:drivers_shared", "drivers_shared/display-mipidsi"]
# 4-wire SPI display bus with non-blocking DMA and FIFO commands (ESP32).
spi-display = ["dep:drivers_shared", "drivers_shared/display-mipidsi"]
# Enable debug-level logging on the serial console (including display timings).
debug-log = []
# Executable memory for the native loader, on the chips listed in
# `executable_memory`; elsewhere the feature adds nothing.
executable-memory = ["dep:native_loader"]
executor = ["dep:embassy-executor", "dep:static_cell"]
power = ["dep:peripherals", "peripherals/power"]
random = ["dep:file_system", "dep:static_cell"]
time = [
  "dep:drivers_shared",
  "dep:embassy-time-driver",
  "dep:embassy-time-queue-utils",
]

# ESP32-S3 station backend and Core network integration.
wifi = [
  "esp32s3",
  "dep:embassy-futures",
  "dep:embassy-net-driver",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:esp-radio",
  "dep:esp-radio-rtos-driver",
  "dep:esp-rtos",
  "dep:file_system",
  "dep:log",
  "dep:network",
  "dep:shared",
  "dep:smoltcp",
  "dep:task",
  "dep:time",
  "dep:virtual_file_system",
]

# Supported Espressif chips (esp-hal 1.2.2). Enable exactly one; without one
# the crate is empty.
esp32 = ["dep:esp-hal", "esp-hal/esp32"]
esp32c2 = ["dep:esp-hal", "esp-hal/esp32c2"]
esp32c3 = ["dep:esp-hal", "esp-hal/esp32c3"]
esp32c5 = ["dep:esp-hal", "esp-hal/esp32c5"]
esp32c6 = ["dep:esp-hal", "esp-hal/esp32c6"]
esp32c61 = ["dep:esp-hal", "esp-hal/esp32c61"]
esp32h2 = ["dep:esp-hal", "esp-hal/esp32h2"]
esp32p4 = ["dep:esp-hal", "esp-hal/esp32p4"]
esp32s2 = ["dep:esp-hal", "esp-hal/esp32s2"]
esp32s3 = ["dep:esp-hal", "esp-hal/esp32s3"]
esp32s31 = ["dep:esp-hal", "esp-hal/esp32s31"]

[lib]
name = "drivers_espressif"
