[package]
name = "xila-drivers-std"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
file_system = { workspace = true }
io_error = { workspace = true }
log = { workspace = true }
memory = { workspace = true }
time = { workspace = true }
network = { workspace = true }
task = { workspace = true }
users = { workspace = true }
synchronization = { workspace = true }
virtual_file_system = { workspace = true }
shared = { workspace = true }
drivers_shared = { package = "xila-drivers-shared", path = "../shared", default-features = false }
peripherals = { workspace = true, features = ["power"] }
device = { workspace = true, optional = true }
native_loader = { workspace = true }

libc = { version = "0.2" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
embassy-executor = { workspace = true, default-features = false, features = [
  "platform-std",
  "executor-thread",
] }
smoltcp = { workspace = true, features = ["phy-tuntap_interface"] }
miniserde = { workspace = true, optional = true }

[features]
default = []
heaptrack = []
profiling = ["task/profiling", "dep:miniserde"]
# Linux uinput human interface emulation controller (keyboard, media remote, mouse toward
# this computer), mounted by the native example at /devices/human_interface/emulation.
human-interface = ["dep:device", "peripherals/human-interface"]

[dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
little_fs = { workspace = true }
critical-section = { workspace = true, features = ["std"] }
testing_support = { workspace = true }

[lib]
name = "drivers_std"
