[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

# Bare-metal firmware: size first, symbols kept in the ELF only.
[profile.release-embedded]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

# Debug runtimes interpret Wasm guests and mix audio in real time. Unoptimized,
# the interpreter renders Synth slower than playback and audio underruns.
# Only these hot crates are optimized; host code keeps fast debug builds.
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3

[profile.dev.package.nanoaudio-dsp]
opt-level = 3

