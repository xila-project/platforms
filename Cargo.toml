[profile.release-wasm]
inherits = "release"
opt-level = 's'
strip = true
lto = true

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/xila-project/core"

[workspace.dependencies]
xila = { git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
xila_http = { git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad", default-features = false }
verification = { git = "https://github.com/xila-project/package_manager", rev = "f5e3f0b323a79a80d106ce2b88b77bfa8667d71b", default-features = false }
application_metadata = { package = "xila-application-metadata", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
application_shortcuts = { package = "xila-application-shortcuts", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
audio = { package = "xila-audio", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
nanoaudio = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-cpal = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-web = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
nanoaudio-synth = { git = "https://github.com/AlixANNERAUD/nanoaudio.git", rev = "596076c64827fd8bf9e8319addc2f215e0cde8be", default-features = false }
abi_declarations = { package = "xila-abi-declarations", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
abi_definitions = { package = "xila-abi-definitions", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
little_fs = { package = "xila-little-fs", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
virtual_file_system = { package = "xila-virtual-file-system", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
graphics = { package = "xila-graphics", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
time = { package = "xila-time", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
task = { package = "xila-task", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
users = { package = "xila-users", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
memory = { package = "xila-memory", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
executable = { package = "xila-executable", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
file_system = { package = "xila-file-system", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
authentication = { package = "xila-authentication", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
log = { package = "xila-log", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
shared = { package = "xila-shared", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
synchronization = { package = "xila-synchronization", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
network = { package = "xila-network", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
debug_protocol = { package = "xila-debug-protocol", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
peripherals = { package = "xila-peripherals", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
bootsplash = { package = "xila-bootsplash", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
embedded-i18n = { version = "=0.1.3", default-features = false, features = [
  "backend-json",
] }
testing = { package = "xila-testing", path = "libraries/testing" }
device = { package = "xila-device", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }

# - Drivers
drivers_core = { package = "xila-drivers-core", git = "https://github.com/xila-project/core", rev = "042c6091c264584cb863f6528bc73d575da245ad" }
drivers_espressif = { package = "xila-drivers-espressif", path = "drivers/espressif" }
drivers_native = { package = "xila-drivers-native", path = "drivers/native" }
drivers_headless = { package = "xila-drivers-headless", path = "drivers/headless" }
drivers_shared = { package = "xila-drivers-shared", path = "drivers/shared" }
drivers_std = { package = "xila-drivers-std", path = "drivers/std" }
drivers_wasm = { package = "xila-drivers-wasm", path = "drivers/wasm" }

# - Executables
file_manager = { package = "xila-file-manager", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
command_line_shell = { package = "xila-command-line-shell", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
graphical_shell = { package = "xila-graphical-shell", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
wasm = { package = "xila-wasm", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
terminal = { package = "xila-terminal", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
settings = { package = "xila-settings", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
debug_application = { package = "xila-debug-application", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
activity = { package = "xila-activity", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
pixel_painter = { package = "xila-pixel-painter", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
text_editor = { package = "xila-text-editor", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
calculator = { package = "xila-calculator", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
weather = { package = "xila-weather", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
clock = { package = "xila-clock", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }
synth = { package = "xila-synth", git = "https://github.com/xila-project/applications", rev = "11260ce074332fa0426e4815a39993b1e791d377" }

# - External crates
embedded-hal = { version = "1", default-features = false }
miniserde = { version = "0.1" }
bindgen = { version = "0.73" }
cbindgen = { version = "0.29" }
syn = { version = "3.0" }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", rev = "90038a9f63c3d711dfdb87069239002629e2121b", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
critical-section = { version = "1.2" }
smoltcp = { version = "0.14" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
  "const_mut_refs",
] }
smol_str = { version = "0.3" }
darling = { version = "0.24" }
regex = { version = "1" }
embedded-io-async = { version = "0.7", features = ["alloc"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-tls = { version = "0.19", default-features = false, features = [
  "alloc",
] }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", rev = "65b20961504ad5ba387ea13f0e9501036941ab17" } # v0.1.0

[workspace]
resolver = "3"
members = [
  "drivers/espressif",
  "drivers/native",
  "drivers/headless",
  "drivers/shared",
  "drivers/std",
  "drivers/wasm",
  "libraries/testing",
  "examples/native",
  "examples/wasm",
  "tools/fs_image",
  "tools/firmware_sim",
  "tools/artifacts",
]

[patch.crates-io]
littlefs2-sys = { git = "https://github.com/xila-project/core", rev = "31089029263ac40a4cd9cd4fc0be1cd3693e2113" }
