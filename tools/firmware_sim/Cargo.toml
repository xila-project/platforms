[package]
name = "xila-firmware-native"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = [
  "firmware_update/device",
  "dep:file_system",
  "dep:virtual_file_system",
  "dep:task",
  "dep:users",
  "dep:time",
  "dep:little_fs",
  "dep:drivers_std",
  "dep:abi_definitions",
  "dep:critical-section",
]

[dependencies]
firmware_update = { workspace = true }
verification = { workspace = true, features = ["sha256", "ed25519"] }
file_system = { workspace = true, optional = true }
virtual_file_system = { workspace = true, optional = true }
task = { workspace = true, optional = true, features = ["test_harness"] }
users = { workspace = true, optional = true }
time = { workspace = true, optional = true }
little_fs = { workspace = true, optional = true }
drivers_std = { workspace = true, optional = true }
abi_definitions = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
shared = { workspace = true }
ed25519-dalek = { version = "3.0", default-features = false }

[[bin]]
name = "xila-firmware-sim"
path = "src/main.rs"
required-features = ["std"]
