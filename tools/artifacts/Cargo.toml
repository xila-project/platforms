[package]
name = "xila-prepare-applications"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmparser = "0.228"
abi_declarations = { workspace = true }
xila-package-reader = { git = "https://github.com/xila-project/package_manager", rev = "38d5bb8d42618b42fa02e93de255f5da23846efb" }
xila-package-verification = { git = "https://github.com/xila-project/package_manager", rev = "38d5bb8d42618b42fa02e93de255f5da23846efb", default-features = false, features = [
  "sha256",
] }
tar-no-std = { version = "0.5.0", default-features = false }

[dev-dependencies]
xila-package-manifest = { git = "https://github.com/xila-project/package_manager", rev = "38d5bb8d42618b42fa02e93de255f5da23846efb" }
xila-package-writer = { git = "https://github.com/xila-project/package_manager", rev = "38d5bb8d42618b42fa02e93de255f5da23846efb" }
