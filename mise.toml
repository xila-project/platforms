[vars]
rust_version = "1.99.0"
node_version = "24.22.0"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"

[tasks."build:native"]
description = "Build the native runtime"
run = "cargo build --locked -p xila-native-example"

[tasks."build:nano-33-ble"]
description = "Build the Arduino Nano 33 BLE firmware"
run = "cargo build --locked -p xila-nano-33-ble-example --target thumbv7em-none-eabihf --profile release-embedded"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "llvm-tools",
], targets = [
  "thumbv7em-none-eabihf",
] }

[tasks."flash:nano-33-ble"]
description = "Build the Arduino Nano 33 BLE firmware and flash it through the Arduino bootloader"
depends = ["build:nano-33-ble"]
# Arduino's fork of bossac: the mainline one does not know the nRF52840.
tools."http:bossac" = { version = "1.9.1-arduino2", bin_path = "bin", platforms = { linux-x64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-linux64.tar.gz" }, linux-arm64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-linuxaarch64.tar.gz" }, macos-x64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-osx.tar.gz" }, macos-arm64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-osx.tar.gz" } } }
run = "examples/nano_33_ble/flash.sh target/thumbv7em-none-eabihf/release-embedded/nano_33_ble_example"

[tasks."check:browser"]
description = "Check the browser runtime"
run = "cargo check --locked -p xila-wasm-example --target wasm32-unknown-unknown"

[tasks."test:seed"]
description = "Test filesystem images and package verification"
run = "cargo test --locked -p xila-fs-image -p xila-prepare-applications"

[tasks."image:native"]
description = "Create a native seed from the released bundles in bundles.lock.json, or from XILA_BUNDLES_DIR"
run = '''
set -eu
mkdir -p target/seed/native
bundles="${XILA_BUNDLES_DIR:-}"
if [ -z "$bundles" ]; then
  bundles=target/seed/native/bundles
  rm -rf "$bundles"
  cargo build --locked -p xila-prepare-applications
  python3 tools/prepare_seed.py --profile native --output "$bundles" \
    --tool "${CARGO_TARGET_DIR:-target}/debug/xila-prepare-applications" --max-abi 1
fi
cargo run --locked -p xila-fs-image -- target/seed/native/seed.img 16777216 --bundle native --bundles-dir "$bundles"
'''

[tasks."image:browser"]
description = "Create a browser seed from the released bundles in bundles.lock.json, or from XILA_BUNDLES_DIR"
run = '''
set -eu
mkdir -p target/seed/browser
bundles="${XILA_BUNDLES_DIR:-}"
if [ -z "$bundles" ]; then
  bundles=target/seed/browser/bundles
  rm -rf "$bundles"
  cargo build --locked -p xila-prepare-applications
  python3 tools/prepare_seed.py --profile browser --output "$bundles" \
    --tool "${CARGO_TARGET_DIR:-target}/debug/xila-prepare-applications" --max-abi 1
fi
cargo run --locked -p xila-fs-image -- target/seed/browser/seed.img 16777216 --bundle wasm --bundles-dir "$bundles"
'''

[tasks."firmware:test"]
description = "Test the native firmware simulator and VFS integration"
run = '''
set -eu
cargo test --locked -p xila-firmware-native
cargo clippy --locked -p xila-firmware-native --all-targets -- -D warnings
cargo check --locked -p xila-firmware-native --no-default-features --lib --target wasm32-unknown-unknown
'''

[tasks."test:drivers"]
description = "Test native and common platform drivers"
run = "cargo test --locked -p xila-drivers-native -p xila-drivers-std -p xila-drivers-shared -p xila-drivers-headless -p xila-drivers-nordic --features xila-drivers-native/audio,xila-drivers-shared/neural-network-cmsis-nn"

[tasks."clippy:drivers"]
description = "Lint native and common platform drivers"
run = "cargo clippy --locked -p xila-drivers-native -p xila-drivers-std -p xila-drivers-shared -p xila-drivers-headless -p xila-drivers-nordic --all-targets --features xila-drivers-native/audio,xila-drivers-shared/neural-network-cmsis-nn -- -D warnings"

[tasks."clippy:browser"]
description = "Lint browser drivers"
run = "cargo clippy --locked -p xila-drivers-wasm --target wasm32-unknown-unknown --features audio -- -D warnings"

[tasks."build:profiling"]
description = "Build the native profiling runtime"
run = "cargo build --locked -p xila-native-example --profile profiling"
