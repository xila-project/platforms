[vars]
rust_version = "1.97.0"
espup_version = "0.19.0"
esp_gcc_version = "16.1.0_20260609"
littlefs_python_version = "0.19.0"
esp_qemu_version = "9.2.2_20261109"
espflash_version = "4.7.0"
node_version = "24.22.0"
wasm_bindgen_version = "0.2.129"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"
uv_version = "0.13.7"
nextest_version = "0.9.148"
pyyaml_version = "6.0.3"

[tasks."build:native"]
description = "Build the native runtime"
run = "cargo build --locked -p xila-native-example"

[tasks."build:nano-33-ble"]
description = "Build the Arduino Nano 33 BLE firmware"
run = "cargo build --locked -p xila-nano-33-ble-example --target thumbv7em-none-eabihf --profile release-embedded"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "llvm-tools",
], targets = [
  "thumbv7em-none-eabihf",
] }

[tasks."release:nano-33-ble-image"]
description = "Export the built Nano 33 BLE ELF as a raw firmware image"
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = [
  "llvm-tools",
], targets = [
  "thumbv7em-none-eabihf",
] }
run = """
set -eu
system_root="$(rustc --print sysroot)"
host="$(rustc -vV | sed -n 's/^host: //p')"
target_directory="${CARGO_TARGET_DIR:-target}"
mkdir -p target/release-artifacts
"$system_root/lib/rustlib/$host/bin/llvm-objcopy" -O binary \
  "$target_directory/thumbv7em-none-eabihf/release-embedded/nano_33_ble_example" \
  target/release-artifacts/nano-33-ble.bin
"""

[tasks."flash:nano-33-ble"]
description = "Build the Arduino Nano 33 BLE firmware and flash it through the Arduino bootloader"
depends = ["build:nano-33-ble"]
# Arduino's fork of bossac: the mainline one does not know the nRF52840.
tools."http:bossac" = { version = "1.9.1-arduino2", bin_path = "bin", platforms = { linux-x64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-linux64.tar.gz" }, linux-arm64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-linuxaarch64.tar.gz" }, macos-x64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-osx.tar.gz" }, macos-arm64 = { url = "https://downloads.arduino.cc/tools/bossac-1.9.1-arduino2-osx.tar.gz" } } }
run = "examples/nano_33_ble/flash.sh target/thumbv7em-none-eabihf/release-embedded/nano_33_ble_example"

[tasks."check:browser"]
description = "Check the browser runtime and driver tests"
run = "cargo check --locked -p xila-wasm-example -p xila-drivers-wasm --target wasm32-unknown-unknown --tests"

[tasks."test:browser-http"]
description = "Run browser HTTP client device tests under Node"
env.CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER = "wasm-bindgen-test-runner"
tools.node = "{{ vars.node_version }}"
tools."github:wasm-bindgen/wasm-bindgen" = "{{ vars.wasm_bindgen_version }}"
run = "cargo test --locked -p xila-drivers-wasm --target wasm32-unknown-unknown --test http_client"

[tasks."test:browser-drivers"]
description = "Run browser driver and canvas input tests in headless Chrome"
env.CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER = "wasm-bindgen-test-runner"
tools."github:wasm-bindgen/wasm-bindgen" = "{{ vars.wasm_bindgen_version }}"
# GitHub-hosted runners ship Chrome and a matching chromedriver in $CHROMEWEBDRIVER. Elsewhere, put a chromedriver that matches your Chrome on PATH or set CHROMEDRIVER.
run = """
set -eu
if [ -z "${CHROMEDRIVER:-}" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then
  export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
fi
cargo test --locked -p xila-drivers-wasm --features audio --target wasm32-unknown-unknown --lib --test browser_input
"""

[tasks."test:seed"]
description = "Test filesystem images and package verification"
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
run = """
set -eu
cargo nextest run --locked -p xila-fs-image -p xila-prepare-applications
cargo test --locked -p xila-fs-image -p xila-prepare-applications --doc
"""

[tasks."image:native"]
description = "Create a native seed from the released bundles in bundles.lock.json, or from XILA_BUNDLES_DIR"
run = '''
set -eu
mkdir -p target/seed/native
bundles="${XILA_BUNDLES_DIR:-}"
if [ -z "$bundles" ]; then
  bundles=target/seed/native/bundles
  rm -rf "$bundles"
  cargo build --locked -p xila-prepare-applications
  python3 tools/prepare_seed.py --profile native --output "$bundles" \
    --tool "${CARGO_TARGET_DIR:-target}/debug/xila-prepare-applications"
fi
cargo run --locked -p xila-fs-image -- target/seed/native/seed.img 16777216 --bundle native --bundles-dir "$bundles"
'''

[tasks."image:browser"]
description = "Create a browser seed from the released bundles in bundles.lock.json, or from XILA_BUNDLES_DIR"
run = '''
set -eu
mkdir -p target/seed/browser
bundles="${XILA_BUNDLES_DIR:-}"
if [ -z "$bundles" ]; then
  bundles=target/seed/browser/bundles
  rm -rf "$bundles"
  cargo build --locked -p xila-prepare-applications
  python3 tools/prepare_seed.py --profile browser --output "$bundles" \
    --tool "${CARGO_TARGET_DIR:-target}/debug/xila-prepare-applications"
fi
cargo run --locked -p xila-fs-image -- target/seed/browser/seed.img 16777216 --bundle wasm --bundles-dir "$bundles"
'''

[tasks."image:wt32-sc01-plus"]
description = "Create a raw 4096-byte LittleFS storage image for the WT32-SC01 Plus from bundles.lock.json, or from XILA_BUNDLES_DIR"
run = '''
set -eu
partition_size=$(awk -F ',' '$1 == "storage" { print $5 }' examples/boards/wt32-sc01-plus/partitions.csv)
if [ -z "$partition_size" ]; then
  echo "Missing storage partition size in partitions.csv" >&2
  exit 1
fi
output=target/seed/wt32-sc01-plus
if [ -L target/seed ] || [ -L "$output" ]; then
  echo "Refusing a symbolic link in the seed output path" >&2
  exit 1
fi
mkdir -p "$output"
staging=$(mktemp -d "$output/.image.XXXXXXXX")
trap 'rm -rf -- "$staging"' EXIT
bundles="${XILA_BUNDLES_DIR:-}"
if [ -z "$bundles" ]; then
  bundles="$staging/bundles"
  cargo build --locked -p xila-prepare-applications
  if ! python3 tools/prepare_seed.py --profile wt32-sc01-plus --output "$bundles" \
    --tool "${CARGO_TARGET_DIR:-target}/debug/xila-prepare-applications"; then
    echo "Released bundle preparation failed. Build bundles locally and set XILA_BUNDLES_DIR as described in examples/boards/README.md." >&2
    exit 1
  fi
fi
cargo run --locked -p xila-fs-image -- "$staging/storage.img" "$((partition_size))" \
  --layout raw --block-size 4096 --bundle wt32-sc01-plus --bundles-dir "$bundles"
python3 -c 'import os, sys; os.replace(sys.argv[1], sys.argv[2])' \
  "$staging/storage.img" "$output/storage.img"
'''

[tasks."firmware:test"]
description = "Test the native firmware simulator and VFS integration"
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
run = '''
set -eu
cargo nextest run --locked -p xila-firmware-native
cargo test --locked -p xila-firmware-native --doc
cargo clippy --locked -p xila-firmware-native --all-targets -- -D warnings
cargo check --locked -p xila-firmware-native --no-default-features --lib --target wasm32-unknown-unknown
'''

[tasks."test:drivers"]
description = "Test native and common platform drivers"
tools."github:nextest-rs/nextest" = "cargo-nextest-{{ vars.nextest_version }}"
run = """
set -eu
cargo nextest run --locked -p xila-drivers-espressif -p xila-drivers-native -p xila-drivers-std -p xila-drivers-shared -p xila-drivers-headless -p xila-drivers-nordic --features xila-drivers-native/audio,xila-drivers-shared/neural-network-cmsis-nn,xila-drivers-shared/display-mipidsi,xila-drivers-shared/touch-ft6336
cargo test --locked -p xila-drivers-espressif -p xila-drivers-native -p xila-drivers-std -p xila-drivers-shared -p xila-drivers-headless -p xila-drivers-nordic --features xila-drivers-native/audio,xila-drivers-shared/neural-network-cmsis-nn,xila-drivers-shared/display-mipidsi,xila-drivers-shared/touch-ft6336 --doc
"""

[tasks."clippy:drivers"]
description = "Lint native and common platform drivers"
run = "cargo clippy --locked -p xila-drivers-espressif -p xila-drivers-native -p xila-drivers-std -p xila-drivers-shared -p xila-drivers-headless -p xila-drivers-nordic --all-targets --features xila-drivers-native/audio,xila-drivers-shared/neural-network-cmsis-nn,xila-drivers-shared/display-mipidsi,xila-drivers-shared/touch-ft6336 -- -D warnings"

[tasks."clippy:browser"]
description = "Lint browser drivers"
run = "cargo clippy --locked -p xila-drivers-wasm --target wasm32-unknown-unknown --features audio -- -D warnings"

[tasks."build:profiling"]
description = "Build the native profiling runtime"
run = "cargo build --locked -p xila-native-example --profile profiling"

[tasks."setup:espressif-rust"]
description = "Install the pinned Espressif Rust, GCC and libclang toolchain (the rustup `esp` toolchain)"
tools."github:esp-rs/espup" = "{{ vars.espup_version }}"
run = """
set -eu
mkdir -p target/espressif-emulator
espup install --targets esp32,esp32s3 --toolchain-version '{{ vars.rust_version }}.0' --skip-version-parse \
  --crosstool-toolchain-version '{{ vars.esp_gcc_version }}' \
  --export-file target/espressif-emulator/export-esp.sh
"""

[tasks."setup:espressif-emulator"]
description = "Install the pinned Xtensa Espressif QEMU and espflash, verified by SHA-256"
run = "bash tools/dev/install_espressif_emulator.sh '{{ vars.esp_qemu_version }}' '{{ vars.espflash_version }}'"

[tasks."setup:esp32c6-emulator"]
description = "Install the pinned RISC-V Espressif QEMU and espflash, verified by SHA-256"
run = "bash tools/dev/install_espressif_emulator.sh '{{ vars.esp_qemu_version }}' '{{ vars.espflash_version }}' riscv32"

[tasks."setup:espflash"]
description = "Install the pinned espflash binary, verified by SHA-256"
run = "bash tools/dev/install_espressif_emulator.sh --espflash-only '{{ vars.espflash_version }}'"

[tasks."run:espflash"]
description = "Run the pinned espflash binary"
depends = ["setup:espflash"]
run = "target/espressif-emulator/tools/espflash-{{ vars.espflash_version }}/espflash"

[tasks."build:esp32-s3-qemu"]
description = "Build the ESP32-S3 QEMU board (examples/boards/esp32-s3-qemu) and merge it into a 4 MiB flash image"
depends = ["setup:espressif-emulator"]
tools.node = "{{ vars.node_version }}"
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' esp32-s3-qemu"

[tasks."build:esp32-c6-qemu"]
description = "Build the ESP32-C6 QEMU board (examples/boards/esp32-c6-qemu) and merge it into a 4 MiB flash image"
depends = ["setup:esp32c6-emulator"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", targets = [
  "riscv32imac-unknown-none-elf",
] }
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' esp32-c6-qemu"

[tasks."build:esp32-p4-function-ev-board"]
description = "Build the ESP32-P4X-Function-EV-Board firmware (examples/boards/esp32-p4-function-ev-board) and merge it into a 16 MiB flash image"
depends = ["setup:espflash"]
tools.rust = { version = "{{ vars.rust_version }}", profile = "minimal", targets = [
  "riscv32imafc-unknown-none-elf",
] }
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' esp32-p4-function-ev-board"

[tasks."build:wt32-sc01"]
description = "Build the WT32-SC01 firmware and merge it into a 4 MiB flash image"
depends = ["setup:espflash"]
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' wt32-sc01"

[tasks."build:wt32-sc01-plus"]
description = "Build the WT32-SC01 Plus firmware (examples/boards/wt32-sc01-plus) and merge it into a 16 MiB flash image"
depends = ["setup:espflash"]
tools.node = "{{ vars.node_version }}"
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' wt32-sc01-plus"

[tasks."build:wt32-sc01-plus-elf"]
description = "Build the WT32-SC01 Plus firmware ELF"
run = "bash tools/dev/build_espressif_image.sh '{{ vars.espflash_version }}' '{{ vars.rust_version }}' '{{ vars.esp_gcc_version }}' wt32-sc01-plus elf"

[tasks."test:esp32-s3-qemu"]
description = "Boot the ESP32-S3 QEMU board headless in Espressif QEMU and check LittleFS, RNG, LVGL, the heap and login with and without a Wi-Fi profile"
depends = ["build:esp32-s3-qemu"]
tools.uv = "{{ vars.uv_version }}"
run = "uv run --no-project --with littlefs-python=={{ vars.littlefs_python_version }} python -I tools/dev/espressif_smoke.py target/espressif-emulator/tools/qemu-{{ vars.esp_qemu_version }}/qemu/bin/qemu-system-xtensa target/espressif-emulator/esp32-s3-qemu-flash.bin target/espressif-emulator/runs"

[tasks."test:esp32-c6-qemu"]
description = "Boot the ESP32-C6 QEMU board headless in Espressif QEMU and check LittleFS, the heap and the shell login prompt"
depends = ["build:esp32-c6-qemu"]
tools.uv = "{{ vars.uv_version }}"
run = "uv run --no-project python -I tools/dev/espressif_smoke.py --chip esp32c6 target/espressif-emulator/tools/qemu-riscv32-{{ vars.esp_qemu_version }}/qemu/bin/qemu-system-riscv32 target/espressif-emulator/esp32-c6-qemu-flash.bin target/espressif-emulator/runs"
