[target.xtensa-esp32-none-elf]
# ESP32 revision v1.x can lose PSRAM writes without the cache workaround.
# LittleFS C is built without it. The board's global heap supplies internal
# SRAM only, so LittleFS never accesses PSRAM.
rustflags = [
  "-C",
  "llvm-args=-mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw",
]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# runner = "espflash --monitor" # Select this runner for espflash v1.x.x
runner = "espflash flash --monitor" # Select this runner for espflash v2.x.x
rustflags = [
  "--cfg",
  "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# runner = "espflash --monitor" # Select this runner for espflash v1.x.x
runner = "espflash flash --monitor" # Select this runner for espflash v2.x.x
rustflags = [
  "--cfg",
  "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[target.thumbv7em-none-eabihf]
# The default SHA-512 is fully unrolled (about 26 KB); the compact variant is a
# loop, which fits the Nano 33 BLE's 448 KB of program flash.
rustflags = ["--cfg", 'sha2_backend_soft="compact"']

[env]
# Bare-metal ARM has no C library: build LittleFS with clang's own headers.
CC_thumbv7em_none_eabihf = "clang"
DEP_LV_CONFIG_PATH = { value = "config/lvgl", relative = true }
EMBEDDED_I18N_LOCALE = "en"
XILA_LV_FONT_CONV_DIR = { value = "node_modules/lv_font_conv", relative = true }
