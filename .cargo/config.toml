[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# runner = "espflash --monitor" # Select this runner for espflash v1.x.x
runner = "espflash flash --monitor" # Select this runner for espflash v2.x.x
rustflags = [
  "--cfg",
  "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# runner = "espflash --monitor" # Select this runner for espflash v1.x.x
runner = "espflash flash --monitor" # Select this runner for espflash v2.x.x
rustflags = [
  "--cfg",
  "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[env]
DEP_LV_CONFIG_PATH = { value = "config/lvgl", relative = true }
EMBEDDED_I18N_LOCALE = "en"
EMBEDDED_I18N_FALLBACK = "en"
XILA_LV_FONT_CONV_DIR = { value = "node_modules/lv_font_conv", relative = true }
LITTLEFS_CONFIG = { value = "config/littlefs/little_fs_config.h", relative = true }
