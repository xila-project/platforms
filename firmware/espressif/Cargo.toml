[package]
name = "xila-firmware-espressif"
version.workspace = true
edition = "2024"
rust-version.workspace = true

# The firmware shared by the Espressif board crates in `examples/boards`. It
# selects no chip: the board crate enables exactly one chip feature of esp-hal,
# esp-storage and `xila-drivers-espressif`, which then apply here too. On host
# targets this crate is empty.
[target.'cfg(all(target_os = "none", any(target_arch = "xtensa", target_arch = "riscv32")))'.dependencies]
# Use the minimal shell unless the board selects Wi-Fi.
command_line_shell = { package = "xila-command-line-shell", git = "https://github.com/xila-project/applications", branch = "main", default-features = false }
critical-section = { workspace = true }
drivers_core = { workspace = true }
drivers_espressif = { package = "xila-drivers-espressif", path = "../../drivers/espressif", default-features = false, features = [
  "console",
  "executor",
  "power",
  "random",
  "time",
] }
drivers_peripherals = { workspace = true }
drivers_shared = { package = "xila-drivers-shared", path = "../../drivers/shared", default-features = false }
mipidsi = { git = "https://github.com/almindor/mipidsi", rev = "5ed6df58d9b8a2b9037221bc03de1328340eaf47", default-features = false, optional = true }
embedded-storage = "0.3"
esp-hal = { version = "=1.2.2", features = ["unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage"] }
startup_application = { package = "xila-startup-application", path = "../startup_application" }
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false }
graphical_shell = { package = "xila-graphical-shell", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
# Native applications for boards with a screen.
activity = { package = "xila-activity", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
file_manager = { package = "xila-file-manager", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
settings = { package = "xila-settings", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
terminal = { package = "xila-terminal", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
# WebAssembly host runtime. Lazy translation is the default on microcontrollers
# so function bodies are translated at their first call rather than all at once
# during load, lowering peak heap usage (`--translation eager` still overrides it).
wasm = { package = "xila-wasm", git = "https://github.com/xila-project/applications", branch = "main", default-features = false, features = [
  "host",
  "memory_32",
  "lazy_translation",
], optional = true }

[features]
# Minimal LVGL display and pointer support.
display = [
  "dep:mipidsi",
  "drivers_shared/display-mipidsi",
  "drivers_shared/touch-ft6336",
  "xila/graphics",
  "xila/graphics_rendering_rgb565",
]
# Full graphical session and native graphical applications.
graphics = [
  "display",
  "dep:activity",
  "dep:file_manager",
  "dep:graphical_shell",
  "dep:settings",
  "dep:terminal",
  "wasm?/graphics",
  "xila/bootsplash",
]
# WebAssembly runtime mounted at `/applications/executables/wasm`. Combined
# with `graphics`, guests also receive the LVGL graphics host import.
wasm = ["dep:wasm"]
neural-network = ["drivers_shared/neural-network-classifier"]
wifi = [
  "drivers_espressif/wifi",
  "command_line_shell/network",
  "drivers_shared/network",
  "xila/network",
]
# Developer-only handler that runs raw ELF files from the file system as native
# executables, with their images in `.dram2_uninit` (ESP32-C6 and ESP32-P4 only).
# It does not sandbox them.
native-dev = ["xila/native-dev", "drivers_espressif/executable-memory"]
# Enables debug-level logging on the serial console, including periodic display
# flush, frame-rate and invalidation summaries.
debug-log = ["drivers_espressif/debug-log"]

[lib]
name = "firmware_espressif"
