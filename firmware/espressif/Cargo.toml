[package]
name = "xila-firmware-espressif"
version.workspace = true
edition = "2024"
rust-version.workspace = true

# The firmware shared by the Espressif board crates in `examples/boards`. It
# selects no chip: the board crate enables exactly one chip feature of esp-hal,
# esp-storage and `xila-drivers-espressif`, which then apply here too. On host
# targets this crate is empty.
[target.'cfg(all(target_os = "none", any(target_arch = "xtensa", target_arch = "riscv32")))'.dependencies]
# Use the minimal shell (plus the time commands, which operate the real-time
# clock this firmware mounts); the board Wi-Fi feature adds the network ones.
command_line_shell = { package = "xila-command-line-shell", git = "https://github.com/xila-project/applications", branch = "main", default-features = false, features = [
  "completion",
  "history",
  "line-editing",
  "time-commands",
] }
critical-section = { workspace = true }
drivers_core = { workspace = true }
drivers_espressif = { package = "xila-drivers-espressif", path = "../../drivers/espressif", default-features = false, features = [
  "console",
  "executor",
  "gpio",
  "power",
  "random",
  "real-time-clock",
  "time",
] }
drivers_peripherals = { workspace = true, features = ["real-time-clock"] }
drivers_shared = { package = "xila-drivers-shared", path = "../../drivers/shared", default-features = false }
mipidsi = { git = "https://github.com/almindor/mipidsi", rev = "5ed6df58d9b8a2b9037221bc03de1328340eaf47", default-features = false, optional = true }
embedded-hal = { workspace = true, optional = true }
peripherals = { workspace = true, features = ["real-time-clock"] }
embedded-storage = "0.3"
esp-hal = { version = "=1.2.2", features = ["unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage"] }
startup_application = { package = "xila-startup-application", path = "../startup_application" }
xila = { git = "https://github.com/xila-project/core", branch = "main", default-features = false, features = [
  "time_services",
  "time_zone",
] }
graphical_shell = { package = "xila-graphical-shell", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
# Native applications for boards with a screen.
activity = { package = "xila-activity", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
file_manager = { package = "xila-file-manager", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
settings = { package = "xila-settings", git = "https://github.com/xila-project/applications", branch = "main", default-features = false, optional = true }
terminal = { package = "xila-terminal", git = "https://github.com/xila-project/applications", branch = "main", optional = true }
# WebAssembly host runtime. Lazy translation is the default on microcontrollers
# so function bodies are translated at their first call rather than all at once
# during load, lowering peak heap usage (`--translation eager` still overrides it).
wasm = { package = "xila-wasm", git = "https://github.com/xila-project/applications", branch = "main", default-features = false, features = [
  "host",
  "memory_32",
  "lazy_translation",
], optional = true }
# Package installer: packages contain WebAssembly applications, so it is
# mounted with the WebAssembly runtime.
package = { workspace = true, optional = true }
# Statically linked C programs (`native-linked` feature).
c_demo = { workspace = true, optional = true }
hexdump = { workspace = true, optional = true }

[features]
# Minimal LVGL display and pointer support.
display = [
  "dep:embedded-hal",
  "dep:mipidsi",
  "drivers_shared/display-mipidsi",
  "drivers_shared/touch-ft6336",
  "xila/graphics",
  "xila/graphics_rendering_rgb565",
]
# Full graphical session and native graphical applications.
graphics = [
  "display",
  "dep:activity",
  "dep:file_manager",
  "dep:graphical_shell",
  "dep:settings",
  "dep:terminal",
  "wasm?/graphics",
  "xila/bootsplash",
]
# WebAssembly runtime mounted at `/applications/executables/wasm`, with the
# package installer at `/applications/executables/package`. Combined
# with `graphics`, guests also receive the LVGL graphics host import.
wasm = ["dep:wasm", "dep:package"]
neural-network = ["drivers_shared/neural-network-classifier"]
wifi = [
  "drivers_espressif/wifi",
  "command_line_shell/network",
  "drivers_shared/network",
  "xila/network",
]
# Developer-only handler that runs raw ELF files from the file system as native
# executables, with their images in `.dram2_uninit` (ESP32-C5, C6, C61, H2, P4,
# S2 and S3). It does not sandbox them.
native-dev = ["xila/native-dev", "drivers_espressif/executable-memory"]
# Statically linked C programs mounted under `/applications/executables`.
native-linked = ["dep:c_demo", "dep:hexdump", "xila/native-linked"]
# Enables debug-level logging on the serial console, including periodic display
# flush, frame-rate and invalidation summaries.
debug-log = ["drivers_espressif/debug-log"]
# Human interface emulation over USB: the board provides a composite USB device
# (CDC-ACM console plus HID keyboard, media remote, mouse and system control) on
# the USB OTG controller, mounted at `/devices/human_interface/emulation`.
usb-human-interface = [
  "drivers_espressif/usb-human-interface",
  "drivers_peripherals/human-interface",
]

# The `time_zone` shell command (show and set the time zone with a TZ string).
time-zone-command = ["command_line_shell/time-zone-command"]
# The UTC offset form of the Settings time zone section. It applies only with
# `graphics`, which links Settings.
time-zone-offset-form = ["settings?/time-zone-offset-form"]
# IANA zone names of the Settings time zone selector, one feature per region
# (see the xila-time-zone README for the flash cost of each). Without one,
# Settings offers the UTC offset form and the TZ string field only. They
# apply only with `graphics`, which links Settings.
time-zone-names-africa = ["settings?/time-zone-names-africa"]
time-zone-names-america = ["settings?/time-zone-names-america"]
time-zone-names-antarctica = ["settings?/time-zone-names-antarctica"]
time-zone-names-arctic = ["settings?/time-zone-names-arctic"]
time-zone-names-asia = ["settings?/time-zone-names-asia"]
time-zone-names-atlantic = ["settings?/time-zone-names-atlantic"]
time-zone-names-australia = ["settings?/time-zone-names-australia"]
time-zone-names-etc = ["settings?/time-zone-names-etc"]
time-zone-names-europe = ["settings?/time-zone-names-europe"]
time-zone-names-indian = ["settings?/time-zone-names-indian"]
time-zone-names-pacific = ["settings?/time-zone-names-pacific"]
time-zone-names-all = ["settings?/time-zone-names-all"]
time-zone-names-legacy-aliases = ["settings?/time-zone-names-legacy-aliases"]

[lib]
name = "firmware_espressif"
